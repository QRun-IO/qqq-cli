name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated client is up to date with the vendored document
        run: |
          npm run generate
          git diff --exit-code packages/ui-api-client/src/schema.ts
      - run: npm run build
      - run: npm test
      - name: Mock server smoke test (Prism on the merged document)
        run: |
          npx prism mock --port 4010 packages/ui-api-client/openapi/qqq-v1.json > prism.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4010/qqq/v1/version && break; sleep 1; done
          curl -fsS http://127.0.0.1:4010/qqq/v1/metaData/authentication
