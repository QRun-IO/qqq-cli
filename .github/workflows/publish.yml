name: publish
# Publishes the three packages to GitHub Packages (npm.pkg.github.com, scope @qrun-io)
# when a version tag (v*) is pushed. The tag must match the client package version.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@qrun-io'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag matches the client version
        run: test "v$(node -p "require('./packages/ui-api-client/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish -w @qrun-io/qqq-ui-api-client --tag rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm publish -w @qrun-io/qqq-ui-api-conformance --tag rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm publish -w @qrun-io/qqq-cli --tag rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
